---
# melonDS standalone: seed config + local BIOS/firmware copies.
# Seed-only-if-missing everywhere: the toml accumulates user state
# (window geometry, joystick mapping) and melonDS mutates the
# firmware file with user settings.

- name: Ensure melonDS directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_melonds_config_dir }}"
    - "{{ dg_melonds_config_dir }}/bios"

- name: Check for user-supplied DS BIOS/firmware
  ansible.builtin.stat:
    path: "{{ dg_bios_root }}/{{ item }}"
  loop: "{{ dg_melonds_bios_files }}"
  register: _melonds_bios_sources

- name: Copy available DS BIOS/firmware from the BIOS root (seed only if missing)
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ dg_melonds_config_dir }}/bios/{{ item.item }}"
    remote_src: true
    force: false
    mode: "0644"
  loop: "{{ _melonds_bios_sources.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Warn about missing optional DS BIOS/firmware
  ansible.builtin.debug:
    msg: "WARNING: melonDS BIOS/firmware file missing: {{ dg_bios_root }}/{{ item.item }}"
  loop: "{{ _melonds_bios_sources.results }}"
  when: not item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Seed melonDS config (seed only if missing)
  ansible.builtin.template:
    src: melonDS.toml.j2
    dest: "{{ dg_melonds_config_dir }}/melonDS.toml"
    force: false
    mode: "0644"
